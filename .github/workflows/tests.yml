name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: python -m pip install requests python-dotenv
      - name: Director tests
        run: python tests/test_director.py -v
      - name: Bridge tests
        run: python tests/test_bridge.py -v
      - name: Frontend syntax check
        if: matrix.os == 'ubuntu-latest'
        run: |
          for f in static/*.js; do node --check "$f"; done
          python - <<'EOF'
          import re
          s = open("avatar.html", encoding="utf-8").read()
          open("/tmp/avatar_inline.js", "w", encoding="utf-8").write(
              re.findall(r"<script>(.*?)</script>", s, re.S)[-1])
          EOF
          node --check /tmp/avatar_inline.js

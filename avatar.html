<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛博小雅 · Live2D 虚拟人</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;}
  body{display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,"PingFang SC",sans-serif;}
  #wrap{display:flex;flex-direction:row;align-items:center;gap:22px;}
  #stage{position:relative;width:min(64vh,78vw);aspect-ratio:400/520;}
  #stage::before{content:"";position:absolute;inset:0;border-radius:24px;
    background:radial-gradient(circle at 50% 30%,#fff6ef 0%,#ffe3ee 52%,#ffcfe0 100%);
    box-shadow:0 18px 60px rgba(0,0,0,.18);}
  #l2d{position:absolute;inset:0;width:100%;height:100%;}
  #l2d-status{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;color:#b0556b;font-size:14px;padding:0 16px;}
  #speech{position:relative;flex:0 0 min(320px,26vw);
    padding:16px 22px;background:#fff;border-radius:20px;
    box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:24px;font-weight:600;
    color:#3a2b33;line-height:1.5;text-align:left;z-index:10;
    opacity:0;transition:opacity .35s;pointer-events:none;}
  #speech.show{opacity:1;}
  #speech::after{content:"";position:absolute;top:50%;left:-13px;
    transform:translateY(-50%);border:13px solid transparent;
    border-right-color:#fff;border-left:0;}
  #danmaku-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7;}
  .danmaku{position:absolute;left:100%;white-space:nowrap;font-size:20px;font-weight:600;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.3);
    animation:danmaku-move 9s linear forwards;}
  @keyframes danmaku-move{to{transform:translateX(-130vw);}}
  #status-badge{position:fixed;right:16px;bottom:16px;padding:8px 14px;
    border-radius:999px;background:rgba(30,20,30,.72);color:#fff;font-size:14px;
    font-weight:600;display:flex;align-items:center;gap:8px;z-index:99;
    box-shadow:0 4px 16px rgba(0,0,0,.3);backdrop-filter:blur(6px);}
  #status-badge .dot{width:10px;height:10px;border-radius:50%;background:#ffb340;flex:0 0 auto;}
  #start-hint{position:fixed;right:16px;bottom:60px;z-index:100;}
  #start-btn{padding:5px 12px;font-size:12px;font-weight:600;color:#fff;background:#ff5f87;
    border:none;border-radius:999px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.3);opacity:.92;}
  #gift-board{position:fixed;left:16px;top:16px;padding:12px 16px;
    background:rgba(30,20,30,.72);color:#fff;border-radius:16px;z-index:90;
    font-size:14px;min-width:150px;backdrop-filter:blur(6px);
    box-shadow:0 4px 16px rgba(0,0,0,.3);display:none;}
  #gift-board .gb-title{font-weight:700;font-size:13px;opacity:.95;margin-bottom:6px;}
  #gift-board .gb-row{display:flex;justify-content:space-between;gap:14px;line-height:1.55;}
  #gift-board .gb-nick{color:#ffd166;font-weight:600;}
</style>
<link rel="stylesheet" href="/static/gift-effects.css">
</head>
<body>
  <div id="wrap">
    <div id="stage">
    <canvas id="l2d"></canvas>
    <div id="l2d-status">正在加载模型…</div>
    <canvas id="fx-canvas"></canvas>
    <div id="danmaku-layer"></div>
    <div id="fx-layer"></div>
    <div id="gift-toast"></div>
    </div>
    <div id="speech"></div>
  </div>

  <div id="status-badge"><span class="dot"></span><span id="status-text">连接中…</span></div>
  <div id="gift-board"></div>
  <div id="start-hint"><button id="start-btn">▶ 点击开始 · 解锁声音</button></div>

<script src="/live2d/pixi.min.js"></script>
<script src="/live2d/live2dcubismcore.min.js"></script>
<script src="/live2d/cubism4.min.js"></script>
<script src="/static/vendor/confetti.browser.js"></script>
<script src="/static/gift-effects.js"></script>
<script src="/static/gift-player.js"></script>
<script src="/static/avatar-motion.js"></script>
<script>
(function(){
  "use strict";
  var W = 800, H = 1040;           // 内部渲染分辨率（2x，更清晰）
  var app = null, model = null, coreModel = null, motionManager = null;
  var giftPlayer = null;
  var lastActionSeq = 0, actionInit = false;
  var lastGiftBoardSig = "";
  var currentModelName = "Hiyori";
  var speechEl = document.getElementById("speech");
  var statusDot = document.querySelector("#status-badge .dot");
  var statusText = document.getElementById("status-text");
  var startHint = document.getElementById("start-hint");
  var statusEl = document.getElementById("l2d-status");

  var speaking = false;
  // 动作引擎：待机/思考/说话状态、眨眼、眼神、情绪、手势、口型都在这里（static/avatar-motion.js）
  var motion = (typeof AvatarMotion === "function") ? new AvatarMotion({
    isMotionLocked: function(){ return !!(giftPlayer && giftPlayer.isMotionActive()); }
  }) : null;
  window.__avatarMotion = motion;   // 调试用
  var lastDanmaku = "";
  var audioCtx = null, analyser = null;

  function setOpenness(o){ if (motion) motion.setLevel(o); }

  var loadToken = 0;

  async function loadModel(name){
    var myToken = ++loadToken;
    try {
      var m = await PIXI.live2d.Live2DModel.from(
        "/live2d/" + name + "/" + name + ".model3.json",
        { motionPreload: "IDLE" }
      );
      if (myToken !== loadToken){   // 期间已有更新的加载请求，丢弃本次结果
        try { m.destroy(); } catch(e){}
        return;
      }
      if (model){
        app.stage.removeChild(model);
        try { model.destroy(); } catch(e){}
      }
      model = m;
      app.stage.addChild(model);

      // 居中 + 适配
      model.anchor.set(0.5, 0.5);
      var s = Math.min(W / model.width, H / model.height) * 1.12;
      model.scale.set(s);
      model.x = W / 2;
      model.y = H / 2;

      coreModel = model.internalModel.coreModel;
      motionManager = model.internalModel.motionManager;
      if (typeof GiftPlayer === "function") {
        if (!giftPlayer) {
          giftPlayer = new GiftPlayer({ model: model, stage: document.getElementById("stage"),
                                        onFinish: function(){ pumpActions(); } });
        } else {
          giftPlayer.setModel(model, document.getElementById("stage"));
        }
      }
      // 重新打开模型自带的 Idle 动作；嘴、眼睛、表情由动作引擎在 motion 之后覆盖，
      // 不再和音频口型冲突。
      if (motion) motion.attach(model);
      statusEl.style.display = "none";
    } catch(e){
      if (myToken === loadToken){
        statusEl.textContent = "模型加载失败：" + (e && e.message ? e.message : e);
      }
      console.error("loadModel failed:", e);
    }
  }

  async function init(){
    try {
      app = new PIXI.Application({
        view: document.getElementById("l2d"),
        transparent: true,
        width: W, height: H,
        backgroundAlpha: 0
      });
      await loadModel(currentModelName);
    } catch(e){
      statusEl.textContent = "模型加载失败：" + (e && e.message ? e.message : e);
      console.error("Live2D init failed:", e);
    }
  }

  function ensureAudio(){
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function showSpeech(text){
    speechEl.textContent = text;
    speechEl.classList.add("show");
  }

  function hideSpeech(){
    speechEl.classList.remove("show");
  }

  function playAudio(seq){
    return new Promise(function(resolve){
      try {
        ensureAudio();
        fetch("/audio?seq=" + seq + "&t=" + Date.now())
          .then(function(r){ if(!r.ok) throw new Error("bad"); return r.arrayBuffer(); })
          .then(function(buf){ return audioCtx.decodeAudioData(buf); })
          .then(function(audioBuf){
            var src = audioCtx.createBufferSource();
            src.buffer = audioBuf;
            src.connect(analyser);

            var data = new Uint8Array(analyser.fftSize);
            speaking = true;
            if (motion) motion.setSpeaking(true);
            function drive(){
              if (!speaking) return;
              analyser.getByteTimeDomainData(data);
              var sum = 0;
              for (var i = 0; i < data.length; i++){
                var v = (data[i] - 128) / 128;
                sum += v * v;
              }
              setOpenness(Math.min(1, Math.sqrt(sum / data.length) * 5));
              requestAnimationFrame(drive);
            }
            src.onended = function(){
              speaking = false;
              if (motion) motion.setSpeaking(false);
              resolve();
            };
            src.start();
            drive();
          })
          .catch(function(){ resolve(); });
      } catch(e){ resolve(); }
    });
  }

  var playQueue = [];
  var lastPlayedSeq = 0;
  var isPlaying = false;
  var queueInit = false;
  // 流式回复会拆成多段（同一 reply_id，part 递增，最后一段 final=true）。
  // 段与段之间可能有短暂空档，不能一播完就收气泡，否则会闪烁。
  var lastItem = null, idleSince = 0;
  var finalSeqs = {};
  var HIDE_AFTER_FINAL_MS = 600, HIDE_AFTER_PARTIAL_MS = 6000;

  function maybeHideSpeech(){
    if (isPlaying || !speechEl.classList.contains("show") || !idleSince) return;
    var done = !lastItem || lastItem.final !== false || finalSeqs[lastItem.seq];
    var idle = Date.now() - idleSince;
    if ((done && idle >= HIDE_AFTER_FINAL_MS) || idle >= HIDE_AFTER_PARTIAL_MS){
      hideSpeech();
      idleSince = 0;
    }
  }

  function enqueueReplies(replies){
    replies = replies || [];
    // 首次加载：跳到当前最新一条，不重播历史（避免刷新后卡住）。
    // 必须在「空列表」时也完成初始化——否则桥刚启动时第一条回复会被当成历史跳过。
    if (!queueInit){
      queueInit = true;
      for (var i = 0; i < replies.length; i++){
        if (replies[i].seq > lastPlayedSeq) lastPlayedSeq = replies[i].seq;
      }
      return;
    }
    if (replies.length === 0) return;
    // 「最后一段」标记是服务端在生成结束后补上的，每次轮询都刷新一下
    for (var k = 0; k < replies.length; k++){
      if (replies[k].final) finalSeqs[replies[k].seq] = true;
    }
    for (var i = 0; i < replies.length; i++){
      var r = replies[i];
      if (r.seq > lastPlayedSeq){
        lastPlayedSeq = r.seq;
        playQueue.push(r);
      }
    }
    if (!isPlaying) playNext();
  }

  function playNext(){
    if (playQueue.length === 0){
      isPlaying = false;
      if (!idleSince) idleSince = Date.now();   // 每次轮询都会走到这里，不能重置计时
      // 整句说完：稍作停留再收气泡；还有后续分段：等下一段，超时兜底
      setTimeout(maybeHideSpeech, HIDE_AFTER_FINAL_MS);
      return;
    }
    isPlaying = true;
    idleSince = 0;
    var item = playQueue.shift();
    lastItem = item;
    showSpeech(item.reply);
    if (motion){
      // 情绪标签由后端从 LLM 回复里解析；每一段都续期，最后一段说完后再保持几秒
      if (item.emotion) motion.setEmotion(item.emotion, item.final === false ? 8 : 4);
      motion.onSentence(item.part || 0);
    }
    playAudio(item.seq).then(function(){ playNext(); });
  }

  function nickColor(nick){
    var hash = 0;
    for (var i = 0; i < nick.length; i++){ hash = (hash * 31 + nick.charCodeAt(i)) >>> 0; }
    return "hsl(" + (hash % 360) + ", 90%, 70%)";
  }

  function spawnDanmaku(nick, content){
    var layer = document.getElementById("danmaku-layer");
    var el = document.createElement("div");
    el.className = "danmaku";
    if (nick){
      var n = document.createElement("span");
      n.style.color = nickColor(nick);
      n.textContent = nick;
      el.appendChild(n);
      el.appendChild(document.createTextNode("：" + content));
    } else {
      el.textContent = content;
    }
    var topPct = 4 + Math.random() * 30;
    el.style.top = topPct + "%";
    if (motion) motion.react("danmaku", { yFrac: topPct / 100 });
    layer.appendChild(el);
    el.addEventListener("animationend", function(){ el.remove(); });
    while (layer.children.length > 40) layer.firstChild.remove();
  }

  function fmtAgo(sec){
    if (sec < 60) return sec + " 秒";
    if (sec < 3600) return Math.floor(sec / 60) + " 分钟";
    return Math.floor(sec / 3600) + " 小时";
  }

  function updateGiftBoard(board){
    var el = document.getElementById("gift-board");
    var sig = JSON.stringify(board || []);
    if (sig === lastGiftBoardSig) return;
    lastGiftBoardSig = sig;
    if (!board || board.length === 0){
      el.style.display = "none";
      return;
    }
    el.style.display = "block";
    el.textContent = "";
    var title = document.createElement("div");
    title.className = "gb-title";
    title.textContent = "🎁 礼物榜";
    el.appendChild(title);
    for (var i = 0; i < Math.min(board.length, 5); i++){
      var nick = board[i][0] || "?";
      var val = board[i][1] || 0;
      var row = document.createElement("div");
      row.className = "gb-row";
      var nameEl = document.createElement("span");
      nameEl.className = "gb-nick";
      nameEl.textContent = (i + 1) + ". " + nick;
      var valueEl = document.createElement("span");
      valueEl.textContent = val + " 💎";
      row.appendChild(nameEl);
      row.appendChild(valueEl);
      el.appendChild(row);
    }
  }

  function updateStatus(s){
    var dot = "#ffb340", text = "连接中…";
    if (speaking){
      dot = "#4cd964"; text = "正在说…";
    } else if (s.status === "processing" || s.status === "queued"){
      dot = "#ffb340"; text = "正在想…";
    } else if (s.status === "error"){
      dot = "#ff5f57"; text = "出错";
    } else {
      dot = "#34c759"; text = "在线 · 就绪";
    }
    if (!speaking && s.last_danmaku_at){
      var ago = Math.max(0, Math.round(Date.now() / 1000 - s.last_danmaku_at));
      text += " · 弹幕 " + fmtAgo(ago) + "前";
    }
    statusDot.style.background = dot;
    statusText.textContent = text;
  }

  // 前端动作队列：服务端按时长串行发布，但前端开播会比服务端晚一个轮询周期，
  // 下一条到达时上一条可能还没播完——排队而不是直接 stop()，避免截掉尾巴。
  var pendingActions = [];
  var MAX_PENDING_ACTIONS = 5;
  function playAction(act){
    try {
      giftPlayer.play(act);
      if (motion) motion.react("gift", { value: (act.gift && act.gift.value) || 0 });
    } catch (err) {
      console.warn("[avatar] gift action failed:", err);
    }
  }
  function pumpActions(){
    if (!giftPlayer || giftPlayer.isActive() || !pendingActions.length) return;
    playAction(pendingActions.shift());
  }

  async function poll(){
    try {
      var r = await fetch("/api/state" + (actionInit ? "?since=" + lastActionSeq : ""));
      var s = await r.json();
      updateStatus(s);
      // LLM 生成期间（还没开口）进入「思考」状态：抬眼、歪头、皱眉，填补等待空档
      if (motion) motion.setThinking(s.status === "processing" && !isPlaying);
      if (s.gift_board) updateGiftBoard(s.gift_board);
      if (s.model && s.model !== currentModelName){
        currentModelName = s.model;
        loadModel(currentModelName);
      }
      if (Array.isArray(s.replies)) enqueueReplies(s.replies);
      maybeHideSpeech();
      if (giftPlayer && Array.isArray(s.actions)) {
        var serverSeq = Number(s.action_seq) || 0;
        // bridge 重启后 action_seq 会归零；前端跟着重置，避免一直不播新动作。
        if (serverSeq < lastActionSeq) lastActionSeq = 0;
        if (!actionInit) {
          actionInit = true;
          lastActionSeq = serverSeq;
        } else {
          // 按 seq 顺序消费所有新动作：普通动作排队，带 interrupt 的立即打断。
          // 不能只播最新一条——一次轮询窗口里可能有多条，旧的会被静默跳过。
          var fresh = s.actions.filter(function(a){ return Number(a.seq) > lastActionSeq; })
            .sort(function(a, b){ return Number(a.seq) - Number(b.seq); });
          fresh.forEach(function(act){
            lastActionSeq = Math.max(lastActionSeq, Number(act.seq) || 0);
            if (act.interrupt) {
              pendingActions = [];
              playAction(act);
            } else {
              pendingActions.push(act);
              if (pendingActions.length > MAX_PENDING_ACTIONS) pendingActions.shift();
            }
          });
          pumpActions();
        }
      }
      if (s.content && s.content !== lastDanmaku){
        lastDanmaku = s.content;
        spawnDanmaku(s.user || "", s.content);
      }
    } catch(e){
      statusDot.style.background = "#ff5f57";
      statusText.textContent = "离线 · 桥未连接";
    }
  }

  document.addEventListener("pointerdown", function(){
    ensureAudio();
    if (startHint) startHint.style.display = "none";
  });
  // 环境已允许自动播放时（如 OBS 浏览器源）自动隐藏提示
  setTimeout(function(){
    try {
      ensureAudio();
      if (audioCtx && audioCtx.state === "running") startHint.style.display = "none";
    } catch(e){}
  }, 800);
  setInterval(poll, 500);
  poll();
  init();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">

<title>赛博小雅 · Live2D 虚拟人</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;}
  ::selection{background:var(--accent);color:#fff;}
  :root{
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-in-out:cubic-bezier(.77,0,.175,1);
    --accent:#ff5f87;
    --gold:#ffd166;
    --glass:rgba(28,20,30,.72);
    --glass-deep:rgba(24,16,26,.85);
    --glass-line:rgba(255,255,255,.1);
    --shadow:0 6px 20px rgba(0,0,0,.32);
    --radius:16px;
  }
  body{display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,"PingFang SC",sans-serif;}
  #wrap{display:flex;flex-direction:row;align-items:center;gap:22px;}
  #stage{position:relative;width:min(64vh,78vw);aspect-ratio:400/520;}
  #stage::before{content:"";position:absolute;inset:0;border-radius:24px;
    background:radial-gradient(circle at 50% 30%,#fff6ef 0%,#ffe3ee 52%,#ffcfe0 100%);
    box-shadow:0 18px 60px rgba(0,0,0,.18);}
  #l2d{position:absolute;inset:0;width:100%;height:100%;}
  #l2d-status{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;color:#b0556b;font-size:14px;padding:0 16px;}
  #stage::after{content:"";position:absolute;inset:8px;border-radius:18px;
    border:1px solid rgba(255,255,255,.5);pointer-events:none;z-index:5;}
  #char-name{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;
    padding:5px 16px;background:rgba(255,255,255,.9);color:#c05a78;
    border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.06em;
    box-shadow:0 4px 14px rgba(0,0,0,.16);}
  #speech{position:relative;flex:0 0 min(320px,26vw);
    padding:16px 22px;background:#fff;border-radius:20px;
    box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:24px;font-weight:600;
    color:#3a2b33;line-height:1.5;text-align:left;z-index:10;
    opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;
    transition:opacity .28s var(--ease-out),transform .28s var(--ease-out);}
  #speech.show{opacity:1;transform:translateY(0) scale(1);}
  #speech::after{content:"";position:absolute;top:50%;left:-13px;
    transform:translateY(-50%);border:13px solid transparent;
    border-right-color:#fff;border-left:0;}
  #danmaku-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7;}
  .danmaku{position:absolute;left:100%;white-space:nowrap;font-size:20px;font-weight:600;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.3);
    animation:danmaku-move 9s linear forwards;}
  @keyframes danmaku-move{to{transform:translateX(-130vw);}}
  #status-badge{position:fixed;right:16px;bottom:16px;padding:8px 14px;
    border-radius:999px;background:var(--glass);color:#fff;font-size:14px;
    font-weight:600;display:flex;align-items:center;gap:8px;z-index:99;
    box-shadow:var(--shadow);backdrop-filter:blur(8px);border:1px solid var(--glass-line);}
  #status-badge .dot{width:10px;height:10px;border-radius:50%;background:#ffb340;flex:0 0 auto;}
  #start-hint{position:fixed;right:16px;bottom:60px;z-index:100;}
  #start-btn{padding:5px 12px;font-size:12px;font-weight:600;color:#fff;background:#ff5f87;
    border:none;border-radius:999px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.3);opacity:.92;
    transition:transform .16s var(--ease-out),opacity .16s var(--ease-out);}
  #start-btn:active{transform:scale(.96);opacity:.85;}
  #start-btn:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  #left-panel{position:fixed;left:16px;top:16px;z-index:90;
    display:flex;flex-direction:column;align-items:stretch;gap:12px;
    width:min(340px,72vw);}
  #gift-board{padding:12px 16px;
    background:var(--glass);color:#fff;border-radius:var(--radius);
    font-size:14px;backdrop-filter:blur(8px);
    box-shadow:var(--shadow);border:1px solid var(--glass-line);display:none;}
  #gift-board .gb-title{display:flex;align-items:center;gap:7px;
    font-weight:800;font-size:13px;letter-spacing:.06em;margin-bottom:6px;}
  #gift-board .gb-title::before{content:"";width:7px;height:7px;border-radius:2px;
    background:var(--gold);box-shadow:0 0 8px var(--gold);}
  #gift-board .gb-row{display:flex;justify-content:space-between;gap:14px;line-height:1.55;}
  #gift-board .gb-nick{color:#ffd166;font-weight:600;}
  #now-playing{position:relative;padding:12px 14px;
    background:linear-gradient(135deg,rgba(42,26,44,.9),rgba(24,16,26,.88));
    color:#fff;border-radius:18px;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    opacity:0;visibility:hidden;transform:translateY(14px) scale(.96);transform-origin:left top;
    transition:opacity .3s var(--ease-out),transform .3s var(--ease-out),visibility 0s .3s;}
  #now-playing.show{opacity:1;visibility:visible;transform:translateY(0) scale(1);
    transition:opacity .3s var(--ease-out),transform .3s var(--ease-out),visibility 0s 0s;}
  #now-playing .np-cover{width:52px;height:52px;border-radius:50%;overflow:hidden;
    flex:0 0 auto;background:#222;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.45);}
  #now-playing .np-cover img{width:100%;height:100%;object-fit:cover;display:block;}
  #now-playing.show .np-cover img{animation:np-spin 12s linear infinite;}
  @keyframes np-spin{to{transform:rotate(360deg);}}
  #now-playing .np-cover::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;
    transform:translate(-50%,-50%);border-radius:50%;background:#140e14;z-index:2;
    box-shadow:0 0 0 3px rgba(255,255,255,.18);}
  #now-playing .np-info{min-width:0;flex:1 1 auto;}
  #now-playing .np-label{font-size:10px;letter-spacing:.12em;opacity:.5;margin-bottom:1px;}
  #now-playing .np-title{font-weight:700;font-size:14px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #now-playing .np-artist{font-size:12px;opacity:.62;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #now-playing .np-eq{display:flex;align-items:flex-end;gap:3px;height:20px;flex:0 0 auto;}
  #now-playing .np-eq span{width:3px;background:#ff5f87;border-radius:2px;
    transform-origin:bottom;animation:np-eq 1s ease-in-out infinite;}
  #now-playing .np-eq span:nth-child(1){height:55%;animation-delay:0s;}
  #now-playing .np-eq span:nth-child(2){height:100%;animation-delay:.25s;}
  #now-playing .np-eq span:nth-child(3){height:45%;animation-delay:.5s;}
  #now-playing .np-eq span:nth-child(4){height:80%;animation-delay:.15s;}
  @keyframes np-eq{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}
  #lyrics{position:relative;text-align:center;padding:0 6px;}
  #lyrics .lyr-line{font-size:22px;color:rgba(255,255,255,.55);font-weight:600;line-height:1.7;
    transform:scale(1);transform-origin:center;
    transition:color .3s var(--ease-out),opacity .3s var(--ease-out),transform .3s var(--ease-out);
    opacity:.6;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  #lyrics .lyr-line.cur{color:#fff;transform:scale(1.18);opacity:1;font-weight:800;}
  #lyrics .lyr-ch{transition:color .12s linear;}
  #lyrics .lyr-ch.sung{color:#ff5f87;}
  #right-panel{position:fixed;right:16px;top:16px;padding:12px 14px;
    background:var(--glass);color:#fff;border-radius:var(--radius);z-index:95;
    font-size:13px;backdrop-filter:blur(8px);box-shadow:var(--shadow);
    border:1px solid var(--glass-line);min-width:200px;}
  #right-panel .rp-title{display:flex;align-items:center;gap:7px;
    font-weight:800;font-size:13px;letter-spacing:.08em;margin-bottom:6px;}
  #right-panel .rp-title::before{content:"";width:7px;height:7px;border-radius:2px;
    background:var(--accent);box-shadow:0 0 8px var(--accent);}
  #right-panel .rp-divider{border-top:1px solid var(--glass-line);margin:8px 0 6px;}
  #right-panel .cp-row{display:flex;justify-content:space-between;gap:18px;line-height:1.7;}
  #right-panel .cp-label{opacity:.7;}
  #right-panel .cp-val{font-weight:700;}
  #right-panel #cp-cost{color:#ff5f87;}
  #right-panel #cp-gift{color:#ffd166;}
  #right-panel .cp-sum{margin-top:3px;justify-content:flex-start;}
  #right-panel #cp-verdict{font-size:12px;opacity:.85;}
  #right-panel .cp-val.flash{animation:cp-flash .5s var(--ease-out);}
  @keyframes cp-flash{0%{transform:scale(1.22);color:#fff;}100%{transform:scale(1);}}
  #right-panel .ch-item{opacity:.8;font-size:12px;line-height:1.85;}
  #right-panel .ch-item b{font-weight:600;margin-right:2px;}
  @media (prefers-reduced-motion:reduce){
    .danmaku{animation:none;}
    #now-playing .np-eq span{animation:none;}
    #now-playing.show .np-cover img{animation:none;}
    #speech,#now-playing,#lyrics .lyr-line{transition:none;}
  }
</style>

<script src="/live2d/pixi.min.js"></script>
<script src="/live2d/live2dcubismcore.min.js"></script>
<script src="/live2d/cubism4.min.js"></script>
<script src="/static/vendor/confetti.browser.js"></script>
<script src="/static/gift-effects.js"></script>
<script src="/static/gift-player.js"></script>
<script src="/static/avatar-motion.js"></script>
<script>
(function(){
  "use strict";
  var W = 800, H = 1040;           // 内部渲染分辨率（2x，更清晰）
  var app = null, model = null, coreModel = null, motionManager = null;
  var giftPlayer = null;
  var lastActionSeq = 0, actionInit = false;
  var lastGiftBoardSig = "";
  var lastMusicSeq = 0;
  var musicEl = document.getElementById("musicPlayer");
  var musicAnalyser = null, musicFreq = null, musicSrcSetup = false;
  var lyricLines = [], lyricIdx = -1;
  var curLyricChars = [], curLyricStart = 0, curLyricEnd = 0;
  var currentModelName = "Hiyori";
  var speechEl = document.getElementById("speech");
  var statusDot = document.querySelector("#status-badge .dot");
  var statusText = document.getElementById("status-text");
  var startHint = document.getElementById("start-hint");
  var statusEl = document.getElementById("l2d-status");

  var speaking = false;
  // 动作引擎：待机/思考/说话状态、眨眼、眼神、情绪、手势、口型都在这里（static/avatar-motion.js）
  var motion = (typeof AvatarMotion === "function") ? new AvatarMotion({
    isMotionLocked: function(){ return !!(giftPlayer && giftPlayer.isMotionActive()); }
  }) : null;
  window.__avatarMotion = motion;   // 调试用
  var lastDanmaku = "";
  var audioCtx = null, analyser = null;

  // 只读视图令牌：从地址栏 ?token=xxx 读取（局域网访问时用）。
  // 服务端不再把令牌注入页面——那样任何能打开页面的人都能拿到，等于没保护。
  // 本机访问时后端直接放行，这里为空也不影响。
  var BRIDGE_TOKEN = "";
  try {
    BRIDGE_TOKEN = new URLSearchParams(window.location.search).get("token") || "";
  } catch (e) { BRIDGE_TOKEN = ""; }
  function apiFetch(url, opts){
    opts = opts || {};
    if (BRIDGE_TOKEN){
      var h = opts.headers || {};
      h["X-Bridge-Token"] = BRIDGE_TOKEN;
      opts.headers = h;
    }
    return fetch(url, opts);
  }

  function setOpenness(o){ if (motion) motion.setLevel(o); }

  var loadToken = 0;

  async function loadModel(name){
    var myToken = ++loadToken;
    try {
      var m = await PIXI.live2d.Live2DModel.from(
        "/live2d/" + name + "/" + name + ".model3.json",
        { motionPreload: "IDLE" }
      );
      if (myToken !== loadToken){   // 期间已有更新的加载请求，丢弃本次结果
        try { m.destroy(); } catch(e){}
        return;
      }
      if (model){
        app.stage.removeChild(model);
        try { model.destroy(); } catch(e){}
      }
      model = m;
      app.stage.addChild(model);

      // 居中 + 适配
      model.anchor.set(0.5, 0.5);
      var s = Math.min(W / model.width, H / model.height) * 1.12;
      model.scale.set(s);
      model.x = W / 2;
      model.y = H / 2;

      coreModel = model.internalModel.coreModel;
      motionManager = model.internalModel.motionManager;
      if (typeof GiftPlayer === "function") {
        if (!giftPlayer) {
          giftPlayer = new GiftPlayer({ model: model, stage: document.getElementById("stage"),
                                        onFinish: function(){ pumpActions(); } });
        } else {
          giftPlayer.setModel(model, document.getElementById("stage"));
        }
      }
      // 重新打开模型自带的 Idle 动作；嘴、眼睛、表情由动作引擎在 motion 之后覆盖，
      // 不再和音频口型冲突。
      if (motion) motion.attach(model);
      statusEl.style.display = "none";
    } catch(e){
      if (myToken === loadToken){
        statusEl.textContent = "模型加载失败：" + (e && e.message ? e.message : e);
      }
      console.error("loadModel failed:", e);
    }
  }

  async function init(){
    try {
      app = new PIXI.Application({
        view: document.getElementById("l2d"),
        transparent: true,
        width: W, height: H,
        backgroundAlpha: 0
      });
      await loadModel(currentModelName);
    } catch(e){
      statusEl.textContent = "模型加载失败：" + (e && e.message ? e.message : e);
      console.error("Live2D init failed:", e);
    }
  }

  function ensureAudio(){
    if (!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function showSpeech(text){
    speechEl.textContent = text;
    speechEl.classList.add("show");
  }

  function hideSpeech(){
    speechEl.classList.remove("show");
  }

  function playAudio(seq){
    return new Promise(function(resolve){
      try {
        ensureAudio();
        apiFetch("/audio?seq=" + seq + "&t=" + Date.now())
          .then(function(r){ if(!r.ok) throw new Error("bad"); return r.arrayBuffer(); })
          .then(function(buf){ return audioCtx.decodeAudioData(buf); })
          .then(function(audioBuf){
            var src = audioCtx.createBufferSource();
            src.buffer = audioBuf;
            src.connect(analyser);

            var data = new Uint8Array(analyser.fftSize);
            speaking = true;
            if (motion) motion.setSpeaking(true);
            function drive(){
              if (!speaking) return;
              analyser.getByteTimeDomainData(data);
              var sum = 0;
              for (var i = 0; i < data.length; i++){
                var v = (data[i] - 128) / 128;
                sum += v * v;
              }
              setOpenness(Math.min(1, Math.sqrt(sum / data.length) * 5));
              requestAnimationFrame(drive);
            }
            src.onended = function(){
              speaking = false;
              if (motion) motion.setSpeaking(false);
              resolve();
            };
            src.start();
            drive();
          })
          .catch(function(){ resolve(); });
      } catch(e){ resolve(); }
    });
  }

  var playQueue = [];
  var lastPlayedSeq = 0;
  var isPlaying = false;
  var queueInit = false;
  // 流式回复会拆成多段（同一 reply_id，part 递增，最后一段 final=true）。
  // 段与段之间可能有短暂空档，不能一播完就收气泡，否则会闪烁。
  var lastItem = null, idleSince = 0;
  var finalSeqs = {};
  var HIDE_AFTER_FINAL_MS = 600, HIDE_AFTER_PARTIAL_MS = 6000;

  function maybeHideSpeech(){
    if (isPlaying || !speechEl.classList.contains("show") || !idleSince) return;
    var done = !lastItem || lastItem.final !== false || finalSeqs[lastItem.seq];
    var idle = Date.now() - idleSince;
    if ((done && idle >= HIDE_AFTER_FINAL_MS) || idle >= HIDE_AFTER_PARTIAL_MS){
      hideSpeech();
      idleSince = 0;
    }
  }

  function enqueueReplies(replies){
    replies = replies || [];
    // 首次加载：跳到当前最新一条，不重播历史（避免刷新后卡住）。
    // 必须在「空列表」时也完成初始化——否则桥刚启动时第一条回复会被当成历史跳过。
    if (!queueInit){
      queueInit = true;
      for (var i = 0; i < replies.length; i++){
        if (replies[i].seq > lastPlayedSeq) lastPlayedSeq = replies[i].seq;
      }
      return;
    }
    if (replies.length === 0) return;
    // 「最后一段」标记是服务端在生成结束后补上的，每次轮询都刷新一下
    for (var k = 0; k < replies.length; k++){
      if (replies[k].final) finalSeqs[replies[k].seq] = true;
    }
    for (var i = 0; i < replies.length; i++){
      var r = replies[i];
      if (r.seq > lastPlayedSeq){
        lastPlayedSeq = r.seq;
        playQueue.push(r);
      }
    }
    if (!isPlaying) playNext();
  }

  function playNext(){
    if (playQueue.length === 0){
      isPlaying = false;
      if (!idleSince) idleSince = Date.now();   // 每次轮询都会走到这里，不能重置计时
      // 整句说完：稍作停留再收气泡；还有后续分段：等下一段，超时兜底
      setTimeout(maybeHideSpeech, HIDE_AFTER_FINAL_MS);
      return;
    }
    isPlaying = true;
    idleSince = 0;
    var item = playQueue.shift();
    lastItem = item;
    showSpeech(item.reply);
    if (motion){
      // 情绪标签由后端从 LLM 回复里解析；每一段都续期，最后一段说完后再保持几秒
      if (item.emotion) motion.setEmotion(item.emotion, item.final === false ? 8 : 4);
      motion.onSentence(item.part || 0);
    }
    playAudio(item.seq).then(function(){ playNext(); });
  }

  function nickColor(nick){
    var hash = 0;
    for (var i = 0; i < nick.length; i++){ hash = (hash * 31 + nick.charCodeAt(i)) >>> 0; }
    return "hsl(" + (hash % 360) + ", 90%, 70%)";
  }

  function spawnDanmaku(nick, content){
    var layer = document.getElementById("danmaku-layer");
    var el = document.createElement("div");
    el.className = "danmaku";
    if (nick){
      var n = document.createElement("span");
      n.style.color = nickColor(nick);
      n.textContent = nick;
      el.appendChild(n);
      el.appendChild(document.createTextNode("：" + content));
    } else {
      el.textContent = content;
    }
    var topPct = 4 + Math.random() * 30;
    el.style.top = topPct + "%";
    if (motion) motion.react("danmaku", { yFrac: topPct / 100 });
    layer.appendChild(el);
    el.addEventListener("animationend", function(){ el.remove(); });
    while (layer.children.length > 40) layer.firstChild.remove();
  }

  function fmtAgo(sec){
    if (sec < 60) return sec + " 秒";
    if (sec < 3600) return Math.floor(sec / 60) + " 分钟";
    return Math.floor(sec / 3600) + " 小时";
  }

  function updateGiftBoard(board){
    var el = document.getElementById("gift-board");
    var sig = JSON.stringify(board || []);
    if (sig === lastGiftBoardSig) return;
    lastGiftBoardSig = sig;
    if (!board || board.length === 0){
      el.style.display = "none";
      return;
    }
    el.style.display = "block";
    el.textContent = "";
    var title = document.createElement("div");
    title.className = "gb-title";
    title.textContent = "礼物榜";
    el.appendChild(title);
    for (var i = 0; i < Math.min(board.length, 5); i++){
      var nick = board[i][0] || "?";
      var val = board[i][1] || 0;
      var row = document.createElement("div");
      row.className = "gb-row";
      var nameEl = document.createElement("span");
      nameEl.className = "gb-nick";
      nameEl.textContent = (i + 1) + ". " + nick;
      var valueEl = document.createElement("span");
      valueEl.textContent = val + " 💎";
      row.appendChild(nameEl);
      row.appendChild(valueEl);
      el.appendChild(row);
    }
  }

  function updateStatus(s){
    var dot = "#ffb340", text = "连接中…";
    if (speaking){
      dot = "#4cd964"; text = "正在说…";
    } else if (s.status === "processing" || s.status === "queued"){
      dot = "#ffb340"; text = "正在想…";
    } else if (s.status === "error"){
      dot = "#ff5f57"; text = "出错";
    } else {
      dot = "#34c759"; text = "在线 · 就绪";
    }
    if (!speaking && s.last_danmaku_at){
      var ago = Math.max(0, Math.round(Date.now() / 1000 - s.last_danmaku_at));
      text += " · 弹幕 " + fmtAgo(ago) + "前";
    }
    statusDot.style.background = dot;
    statusText.textContent = text;
  }

  // 前端动作队列：服务端按时长串行发布，但前端开播会比服务端晚一个轮询周期，
  // 下一条到达时上一条可能还没播完——排队而不是直接 stop()，避免截掉尾巴。
  var pendingActions = [];
  var MAX_PENDING_ACTIONS = 5;
  function playAction(act){
    try {
      giftPlayer.play(act);
      if (motion) motion.react("gift", { value: (act.gift && act.gift.value) || 0 });
    } catch (err) {
      console.warn("[avatar] gift action failed:", err);
    }
  }
  function pumpActions(){
    if (!giftPlayer || giftPlayer.isActive() || !pendingActions.length) return;
    playAction(pendingActions.shift());
  }

  function playMusic(np){
    var banner = document.getElementById("now-playing");
    var txt = document.getElementById("np-text");
    var artist = document.getElementById("np-artist");
    var img = document.getElementById("np-img");
    if (!np || !np.url){
      if (banner) banner.classList.remove("show");
      if (musicEl){ try{ musicEl.pause(); }catch(e){} }
      if (motion) motion.setMusic(0);
      return;
    }
    if (txt) txt.textContent = np.name || "—";
    if (artist) artist.textContent = np.artist || "";
    if (img) img.src = np.pic || "";
    if (banner) banner.classList.add("show");
    lyricLines = Array.isArray(np.lyric) ? np.lyric : [];
    lyricIdx = -1;
    updateLyrics(-1);
    // 原生 <audio> 播放 + 分析器律动（crossOrigin 必须在 src 之前设置）
    if (musicEl){
      musicEl.crossOrigin = "anonymous";
      setupMusicAnalyser();
      musicEl.src = np.url;
      musicEl.play().catch(function(){});
    }
  }

  function findLyricIndex(t){
    var idx = -1;
    for (var i = 0; i < lyricLines.length; i++){
      if (lyricLines[i].t <= t) idx = i; else break;
    }
    return idx;
  }

  function updateLyrics(idx){
    var prev = document.getElementById("lyr-prev");
    var cur = document.getElementById("lyr-cur");
    var next = document.getElementById("lyr-next");
    if (!cur) return;
    if (prev) prev.textContent = idx > 0 ? lyricLines[idx - 1].text : "";
    // 当前行拆成字符 span，用于「唱到哪变到哪」逐字上色
    cur.textContent = "";
    curLyricChars = [];
    if (idx >= 0 && idx < lyricLines.length){
      var text = lyricLines[idx].text;
      for (var i = 0; i < text.length; i++){
        var sp = document.createElement("span");
        sp.className = "lyr-ch";
        sp.textContent = text[i];
        cur.appendChild(sp);
        curLyricChars.push(sp);
      }
      curLyricStart = lyricLines[idx].t;
      var gap = (idx + 1 < lyricLines.length) ? (lyricLines[idx + 1].t - curLyricStart) : 5;
      curLyricEnd = curLyricStart + gap * 0.8;
    } else {
      cur.textContent = "♪";
    }
    if (next) next.textContent = (idx >= 0 && idx + 1 < lyricLines.length) ? lyricLines[idx + 1].text : "";
  }

  function updateLyricProgress(t){
    if (!curLyricChars.length) return;
    var dur = curLyricEnd - curLyricStart;
    if (dur <= 0) return;
    var p = Math.max(0, Math.min(1, (t - curLyricStart) / dur));
    var n = Math.floor(p * curLyricChars.length);
    for (var i = 0; i < curLyricChars.length; i++){
      if (i < n) curLyricChars[i].classList.add("sung");
      else curLyricChars[i].classList.remove("sung");
    }
  }

  function setupMusicAnalyser(){
    if (musicSrcSetup || !musicEl) return;
    musicSrcSetup = true;
    try {
      ensureAudio();
      var src = audioCtx.createMediaElementSource(musicEl);
      musicAnalyser = audioCtx.createAnalyser();
      musicAnalyser.fftSize = 256;
      musicFreq = new Uint8Array(musicAnalyser.frequencyBinCount);
      src.connect(musicAnalyser);
      musicAnalyser.connect(audioCtx.destination);
    } catch(e){}
  }

  function musicMotionLoop(){
    requestAnimationFrame(musicMotionLoop);
    // 歌词逐字进度（每帧更新，独立于分析器）
    if (musicEl && !musicEl.paused && !musicEl.ended){
      updateLyricProgress(musicEl.currentTime);
    }
    if (!musicAnalyser || !motion) return;
    var playing = musicEl && !musicEl.paused && !musicEl.ended;
    if (!playing){ motion.setMusic(0); return; }
    // 真实鼓点律动：crossOrigin 已设，分析器能读到音频
    musicAnalyser.getByteFrequencyData(musicFreq);
    var bass = 0;
    for (var i = 0; i < 12; i++) bass += musicFreq[i];
    motion.setMusic(Math.min(1, (bass / 12) / 170));
  }

  musicEl.addEventListener("timeupdate", function(){
    if (!lyricLines.length) return;
    var idx = findLyricIndex(musicEl.currentTime);
    if (idx !== lyricIdx){ lyricIdx = idx; updateLyrics(idx); }
  });
  musicEl.addEventListener("error", function(){
    var t = document.getElementById("np-text");
    if (t) t.textContent = "⚠️ 播放出错，再点一次歌试试";
  });
  requestAnimationFrame(musicMotionLoop);

  var lastCostStr = "";
  function updateCostPanel(u, giftTotal){
    var costEl = document.getElementById("cp-cost");
    if (!u || !costEl) return;
    // deepseek 价格(约)：输入 ¥2/M，输出 ¥8/M（展示 ×10000）
    var cost = ((u.prompt || 0) / 1e6 * 2 + (u.completion || 0) / 1e6 * 8) * 10000;
    var costStr = "¥" + cost.toFixed(2);
    if (costStr !== lastCostStr){          // 数值变化时才闪烁
      lastCostStr = costStr;
      costEl.textContent = costStr;
      costEl.classList.remove("flash");
      void costEl.offsetWidth;
      costEl.classList.add("flash");
    }
    var giftEl = document.getElementById("cp-gift");
    if (giftEl) giftEl.textContent = (giftTotal || 0) + " 钻石";
    var verdictEl = document.getElementById("cp-verdict");
    if (verdictEl){
      var giftYuan = (giftTotal || 0) / 2;   // 钻石 / 2 = 真实价格(元)
      verdictEl.textContent = giftYuan >= cost
        ? "✅ 礼物已覆盖消耗 (+¥" + (giftYuan - cost).toFixed(2) + ")"
        : "📉 消耗高于礼物 (¥" + (cost - giftYuan).toFixed(2) + ")";
    }
  }

  async function poll(){
    try {
      var r = await apiFetch("/api/state" + (actionInit ? "?since=" + lastActionSeq : ""));
      var s = await r.json();
      updateStatus(s);
      // LLM 生成期间（还没开口）进入「思考」状态：抬眼、歪头、皱眉，填补等待空档
      if (motion) motion.setThinking(s.status === "processing" && !isPlaying);
      if (s.gift_board) updateGiftBoard(s.gift_board);
      if (s.usage) updateCostPanel(s.usage, s.gift_total);
      if (s.now_playing && Number(s.now_playing.seq) !== lastMusicSeq){
        lastMusicSeq = Number(s.now_playing.seq);
        playMusic(s.now_playing);
      }
      if (s.model && s.model !== currentModelName){
        currentModelName = s.model;
        loadModel(currentModelName);
      }
      if (Array.isArray(s.replies)) enqueueReplies(s.replies);
      maybeHideSpeech();
      if (giftPlayer && Array.isArray(s.actions)) {
        var serverSeq = Number(s.action_seq) || 0;
        // bridge 重启后 action_seq 会归零；前端跟着重置，避免一直不播新动作。
        if (serverSeq < lastActionSeq) lastActionSeq = 0;
        if (!actionInit) {
          actionInit = true;
          lastActionSeq = serverSeq;
        } else {
          // 按 seq 顺序消费所有新动作：普通动作排队，带 interrupt 的立即打断。
          // 不能只播最新一条——一次轮询窗口里可能有多条，旧的会被静默跳过。
          var fresh = s.actions.filter(function(a){ return Number(a.seq) > lastActionSeq; })
            .sort(function(a, b){ return Number(a.seq) - Number(b.seq); });
          fresh.forEach(function(act){
            lastActionSeq = Math.max(lastActionSeq, Number(act.seq) || 0);
            if (act.interrupt) {
              pendingActions = [];
              playAction(act);
            } else {
              pendingActions.push(act);
              if (pendingActions.length > MAX_PENDING_ACTIONS) pendingActions.shift();
            }
          });
          pumpActions();
        }
      }
      if (s.content && s.content !== lastDanmaku){
        lastDanmaku = s.content;
        spawnDanmaku(s.user || "", s.content);
      }
    } catch(e){
      statusDot.style.background = "#ff5f57";
      statusText.textContent = "离线 · 桥未连接";
    }
  }

  document.addEventListener("pointerdown", function(){
    ensureAudio();
    if (startHint) startHint.style.display = "none";
  });
  // 环境已允许自动播放时（如 OBS 浏览器源）自动隐藏提示
  setTimeout(function(){
    try {
      ensureAudio();
      if (audioCtx && audioCtx.state === "running") startHint.style.display = "none";
    } catch(e){}
  }, 800);
  setInterval(poll, 500);
  poll();
  init();
})();
</script>
